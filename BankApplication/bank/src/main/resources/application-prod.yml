spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=${CACHE_MAX_SIZE:5000},expireAfterWrite=${CACHE_EXPIRE_AFTER_WRITE:10m}

  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:10MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

bank:
  api-docs:
    public: ${BANK_API_DOCS_PUBLIC:false}

  idempotency:
    ttl-minutes: ${IDEMPOTENCY_TTL_MINUTES:1440}

  file-storage:
    root-location: ${FILE_STORAGE_ROOT}
    max-file-size-bytes: ${FILE_MAX_SIZE_BYTES:10485760}
    max-files-per-owner: ${MAX_FILES_PER_OWNER:100}
    allowed-extensions:
      - pdf
      - jpg
      - jpeg
      - png
      - xlsx
      - docx
    create-directory-if-missing: true

  performance:
    slow-method-threshold-ms: ${PERFORMANCE_SLOW_METHOD_THRESHOLD_MS:1000}

  security:
    jwt:
      issuer: ${JWT_ISSUER:banking-application}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000}
      private-key: ${JWT_PRIVATE_KEY_BASE64}
      public-key: ${JWT_PUBLIC_KEY_BASE64}

logging:
  level:
    root: INFO
    com.example.bank: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}

  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator

    access:
      default: none

    jmx:
      exposure:
        exclude: "*"

  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: true

    info:
      access: read-only

    metrics:
      access: read-only

  health:
    defaults:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}

  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

  packages-to-scan: com.example.bank.controller.rest
  paths-to-match: /api/v1/**